services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-evercanon}
      POSTGRES_USER: ${POSTGRES_USER:-evercanon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      # Bind locally for development; do not expose PostgreSQL publicly in production.
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - evercanon_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-evercanon} -d ${POSTGRES_DB:-evercanon}"]
      interval: 5s
      timeout: 3s
      retries: 10

  # One-shot job: apply reviewed SQL migrations, then seed the opening story.
  # Both commands are idempotent, so this is safe to run on every `up`.
  migrate:
    build:
      context: .
      target: migrator
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-evercanon}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-evercanon}
    command: ["sh", "-lc", "npm run db:migrate && npm run db:seed"]

  app:
    build:
      context: .
      target: runner
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    environment:
      # Reaches the database by Compose service name, not localhost.
      DATABASE_URL: postgresql://${POSTGRES_USER:-evercanon}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-evercanon}
      VISITOR_COOKIE_SECRET: ${VISITOR_COOKIE_SECRET:?Set VISITOR_COOKIE_SECRET in .env}
    ports:
      - "${APP_PORT:-3000}:3000"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:3000/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

volumes:
  evercanon_postgres_data:
